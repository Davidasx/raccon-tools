<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Raccon ATK/DEF计算器</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="container">
            <h1>Raccon ATK/DEF计算器</h1>

            <!-- 标签页切换 -->
            <div class="tabs">
                <button
                    class="tab-btn active"
                    onclick="switchTab('probability')"
                >
                    打怪概率
                </button>
                <button class="tab-btn" onclick="switchTab('range')">
                    ATK变化查询
                </button>
            </div>

            <!-- 打怪概率功能 -->
            <div class="tab-content" id="probabilityTab">
                <div class="card">
                    <h3>打怪概率</h3>
                    <div class="input-group">
                        <label for="atkInput">输入 ATK:</label>
                        <input
                            type="number"
                            id="atkInput"
                            step="0.1"
                            value="65.0"
                            oninput="runQuery()"
                        />
                    </div>
                    <div class="filter-section">
                        <div class="rarity-filters" id="rarityFilters"></div>
                        <div class="search-box">
                            <input
                                type="text"
                                id="mobSearch"
                                placeholder="搜索怪物名称..."
                                oninput="runQuery()"
                            />
                        </div>
                    </div>
                    <div id="singleQueryResult"></div>
                </div>
            </div>

            <!-- ATK变化查询功能 -->
            <div class="tab-content" id="rangeTab" style="display: none">
                <div class="card">
                    <h3>ATK变化影响</h3>
                    <div class="input-group">
                        <label>范围:</label>
                        <input
                            type="number"
                            id="rangeStart"
                            step="0.1"
                            value="65.0"
                            oninput="runRange()"
                        />
                        <span>至</span>
                        <input
                            type="number"
                            id="rangeEnd"
                            step="0.1"
                            value="86.0"
                            oninput="runRange()"
                        />
                    </div>
                    <div id="rangeResult"></div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <a
                href="https://github.com/Davidasx/raccon-tools"
                target="_blank"
                class="footer-link"
            >
                <svg
                    class="github-icon"
                    viewBox="0 0 16 16"
                    width="20"
                    height="20"
                >
                    <path
                        fill="currentColor"
                        d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
                    />
                </svg>
                GitHub
            </a>
            <span class="footer-separator">|</span>
            <a href="https://davidx.top" target="_blank" class="footer-link"
                >Homepage</a
            >
        </footer>

        <script src="script.js"></script>
    </body>
</html>
